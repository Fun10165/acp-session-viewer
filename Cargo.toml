[package]
name = "acp-view"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "2.2.0"
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
getrandom = "0.4.3"
glob = "0.3.4"
globset = "0.4.20"
libc = "0.2.189"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"
url = "2.5.8"
